services:
  postgres:
    image: postgres:16
    container_name: qguard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: qguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qguard_password}
      POSTGRES_DB: qguard_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: